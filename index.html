<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi primer HTLM</title>
</head>

<body>
    <main>
        <!--- Sección de bienvenida-->
        <section>
            <h1>Bienvenido a mi primer proyecto web</h1>
            <p>Este es es mi primer proyecto web! donde podras encontrar imagenes y videos para que puedas distraerte un
                rato :D
            </p>
            <p>Autor: David Esteban Aragon</p>
        </section>
        <!--- Sección de imagenes-->
        <section>
            <h3>Imagenes divertidas</h3>
            <figure>
                <img src="./imagenes/Imagen_1.jpg" alt="Guatape antioquia" />
                <figcaption> Imagen de Guatape</figcaption>
            </figure>
            <figure>
                <img src="./imagenes/Imagen_2.jpg" alt="Centro de Bogotá" />
                <figcaption> Imagen de Bogotá</figcaption>
            </figure>
            <figure>
                <img src="./imagenes/Imagen_3.jpg" alt="Palmas" />
                <figcaption> Imagen de palmas</figcaption>
            </figure>
            <figure>
                <img src="./imagenes/Imagen_4.jpg" alt="Parque Tairona" />
                <figcaption> Playa del Parque Tairona</figcaption>
            </figure>
            <figure>
                <img src="./imagenes/Imagen_5.jpg" alt="Amazonas Colombiano" />
                <figcaption> Imagen de una casa en el rio amazonas</figcaption>
            </figure>
            <figure>
                <img src="./imagenes/Imagen_6.jpg" alt="Recoger cafe" />
                <figcaption> Zona cafetera de Colombia</figcaption>
            </figure>
        </section>

        <!--- Sección de videos-->
        <section>
            <h3>Videos de naturaleza</h3>
            <figure>
                <video controls preload="auto">
                    <source src="./imagenes/Mar.mp4" />
                </video>
            </figure>
            <figure>
                <video controls preload="auto">
                    <source src="./imagenes/Pajaros.mp4" />
                </video>
            </figure>
            <figure>
                <video controls preload="auto">
                    <source src="./imagenes/Peces.mp4" />
                </video>
            </figure>
        </section>


    </main>
</body>

</html>
